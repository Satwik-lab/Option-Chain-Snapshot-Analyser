<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Analysis Result</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Option Chain Analysis</h1>

    <div class="card">

        <h2>Snapshot Information</h2>

        <p>
            <strong>Symbol:</strong>
            {{ symbol }}
        </p>

        <p>
            <strong>Expiry:</strong>
            {{ expiry }}
        </p>

    </div>


    <div class="card">

        <h2>Uploaded Option Chain</h2>

        {{ data | safe }}

    </div>


    <br>

    <a href="/">
        ← Back to Dashboard
    </a>

</div>

</body>

</html>
